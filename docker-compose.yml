# Entorno local: `docker compose up --build` levanta Postgres, aplica las migraciones y arranca la API.

x-postgres-connection: &postgres-connection
  ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=pymecommerce;Username=postgres;Password=postgres"

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: pymecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # solo para desarrollo local
    ports:
      - "5432:5432"
    volumes:
      # Desde Postgres 18 los datos viven en /var/lib/postgresql/<versión>/docker,
      # así que el volumen se monta en /var/lib/postgresql (no en .../data).
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pymecommerce"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Misma imagen que la API, pero con --migrate: aplica las migraciones de todos los módulos y termina.
  migrator:
    build: .
    image: pyme-commerce-api:local
    command: ["--migrate"]
    environment:
      <<: *postgres-connection
    depends_on:
      postgres:
        condition: service_healthy # `depends_on` solo no espera a que Postgres acepte conexiones

  api:
    build: .
    image: pyme-commerce-api:local
    environment:
      <<: *postgres-connection
    ports:
      - "8080:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully # arranca solo si las migraciones terminaron bien

volumes:
  postgres-data:
